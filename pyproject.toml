[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simcoach"
version = "0.1.0"
description = "iRacing training coach: live delta and corner-by-corner coaching against Garage 61 laps"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "numpy>=1.26",
  "requests>=2.31",
  "openpyxl>=3.1",
  "pyirsdk>=1.3; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "pyinstaller"]

[project.scripts]
simcoach = "simcoach.__main__:main"

[tool.setuptools]
packages = ["simcoach"]

[tool.setuptools.package-data]
simcoach = ["static/*"]
