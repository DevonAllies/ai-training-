[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datalab-trainer"
dynamic = ["version"]
description = "Hands-on data analysis and data science training: import, clean, EDA, modelling, SHAP and report writing in SQL, Python and R"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.0", "pandas>=2.0", "numpy>=1.26", "matplotlib>=3.7", "scipy>=1.11",
  "scikit-learn>=1.3", "statsmodels>=0.14", "openpyxl>=3.1", "shap>=0.44",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
datalab = "datalab.__main__:main"

[tool.setuptools]
packages = ["datalab"]

[tool.setuptools.dynamic]
version = { attr = "datalab.__version__" }

[tool.setuptools.package-data]
datalab = ["static/*", "data/*", "curriculum/stages/*.md", "curriculum/exercises/*.ex"]
