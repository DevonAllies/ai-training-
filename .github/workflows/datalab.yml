name: DataLab Trainer

# Tests run on every change to datalab_trainer/. After the tests pass, the app is built
# for Windows (installer + portable zip) and Linux (.deb + portable tar.gz), and every
# build is smoke-tested by running all exercise solutions through the packaged app.
#
# To publish a GitHub release: Actions -> DataLab Trainer -> Run workflow -> tick "release"
# (or push a tag named datalab-v<version>). Releases are never marked "latest", so
# SimCoach's auto-updater (which follows the latest release) is unaffected.

on:
  push:
    branches: ["**"]          # needed: listing only tags would stop branch pushes from triggering
    tags: ["datalab-v*"]      # path filters don't apply to tag pushes
    paths: ["datalab_trainer/**", ".github/workflows/datalab.yml"]
  pull_request:
    paths: ["datalab_trainer/**", ".github/workflows/datalab.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release (tag datalab-v<version from datalab/__init__.py>)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: datalab_trainer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Install with install.sh (Ubuntu)
        if: runner.os == 'Linux'
        run: ./install.sh
      - name: Install with install.bat (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: install.bat < NUL

      - name: Run tests (every exercise solution in SQL, Python and R)
        shell: bash
        run: |
          if [ -x .venv/bin/python ]; then PY=.venv/bin/python; else PY=.venv/Scripts/python.exe; fi
          "$PY" -m pip install pytest
          Rscript --version
          "$PY" -m pytest -q tests -rs

      - name: Start the server and fetch the dashboard
        shell: bash
        run: |
          if [ -x .venv/bin/python ]; then PY=.venv/bin/python; else PY=.venv/Scripts/python.exe; fi
          export DATALAB_HOME="$RUNNER_TEMP/datalab-home"
          "$PY" -m datalab --no-browser --port 8070 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8070/api/overview >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8070/ | grep -q "DataLab"
          curl -sf "http://127.0.0.1:8070/api/env" | "$PY" -c "import json,sys; e=json.load(sys.stdin); print(e['python']['version'], e['r'].get('version'), e['sql']); assert e['r'].get('version')"

  build:
    name: Build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-22.04        # older glibc, so the build runs on Ubuntu 22.04 and newer
    runs-on: ${{ matrix.os }}
    outputs:
      version: ${{ steps.ver.outputs.version }}
    defaults:
      run:
        working-directory: datalab_trainer
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: r-lib/actions/setup-r@v2      # only for the smoke test; R is not bundled
        with:
          r-version: release

      - name: Work out version
        id: ver
        run: |
          base=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('datalab/__init__.py').read()).group(1))")
          if [ "${{ github.ref_type }}" = "tag" ]; then v="${GITHUB_REF_NAME#datalab-v}"
          elif [ "${{ inputs.release }}" = "true" ]; then v="$base"
          else v="$base.${{ github.run_number }}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building DataLab Trainer $v"

      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller pillow

      - name: Build the app with PyInstaller
        run: python -m PyInstaller --noconfirm --distpath dist --workpath build packaging/datalab.spec

      - name: Smoke test the built app (all exercise solutions)
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then EXE=dist/DataLabTrainer/DataLabTrainer.exe; else EXE=dist/DataLabTrainer/DataLabTrainer; fi
          python packaging/smoke_test.py "$EXE"

      - name: Windows installer and portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" packaging\DataLabTrainer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist\DataLabTrainer -DestinationPath "dist\DataLabTrainer-${{ steps.ver.outputs.version }}-windows-portable.zip"

      - name: Linux .deb and portable tar.gz
        if: runner.os == 'Linux'
        run: packaging/build_linux.sh "${{ steps.ver.outputs.version }}"

      - name: Checksums
        run: |
          cd dist
          files=$(ls DataLabTrainer-Setup-*.exe DataLabTrainer-*-windows-portable.zip DataLabTrainer-*-linux-x86_64.tar.gz datalab-trainer_*_amd64.deb 2>/dev/null || true)
          sha256sum $files > "SHA256SUMS-${{ matrix.name }}.txt"
          cat "SHA256SUMS-${{ matrix.name }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: DataLabTrainer-${{ steps.ver.outputs.version }}-${{ matrix.name }}
          path: |
            datalab_trainer/dist/DataLabTrainer-Setup-*.exe
            datalab_trainer/dist/DataLabTrainer-*-windows-portable.zip
            datalab_trainer/dist/DataLabTrainer-*-linux-x86_64.tar.gz
            datalab_trainer/dist/datalab-trainer_*_amd64.deb
            datalab_trainer/dist/SHA256SUMS-*.txt
          if-no-files-found: error

  release:
    name: GitHub release
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: datalab-v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: DataLab Trainer ${{ needs.build.outputs.version }}
          files: artifacts/*
          make_latest: false         # keep SimCoach's auto-updater on SimCoach releases
          body: |
            **DataLab Trainer ${{ needs.build.outputs.version }}**: data analysis and data science training in SQL, Python and R.

            | System | Download | How to install |
            |---|---|---|
            | Windows 10/11 | `DataLabTrainer-Setup-*.exe` | run it (no admin rights needed) |
            | Windows, no install | `DataLabTrainer-*-windows-portable.zip` | unzip, run `DataLabTrainer.exe` |
            | Ubuntu / Debian | `datalab-trainer_*_amd64.deb` | `sudo apt install ./datalab-trainer_*_amd64.deb` |
            | Other Linux | `DataLabTrainer-*-linux-x86_64.tar.gz` | unpack, run `./DataLabTrainer` (`./install-desktop-entry.sh` adds a menu entry) |

            Python and every library are included. For the R exercises install R
            (Windows: https://cran.r-project.org/bin/windows/base/, Ubuntu: `sudo apt install r-base`).
