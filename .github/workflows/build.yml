name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release (tag v<version from simcoach/__init__.py>)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q tests

  windows:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Work out version
        id: ver
        shell: pwsh
        run: |
          $base = (Select-String -Path simcoach/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart("v") }
          elseif ("${{ inputs.release }}" -eq "true") { $v = $base }
          else { $v = "$base.${{ github.run_number }}" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Building SimCoach $v"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller pytest httpx

      - name: Tests (Windows)
        run: python -m pytest -q tests

      - name: Build SimCoach.exe
        run: pyinstaller --noconfirm --distpath dist --workpath build packaging/simcoach.spec

      - name: Smoke test the built app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\SimCoach\SimCoach.exe -ArgumentList "--demo","--no-browser","--no-overlay","--no-tray","--port","8077" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 40 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            try {
              $s = Invoke-RestMethod http://127.0.0.1:8077/api/status
              if ($s.version) { $ok = $true; Write-Host "SimCoach $($s.version) is up: $($s.live.status)" }
            } catch {}
          }
          Invoke-WebRequest http://127.0.0.1:8077/ -UseBasicParsing | Out-Null
          Invoke-WebRequest http://127.0.0.1:8077/overlay -UseBasicParsing | Out-Null
          $upd = Invoke-RestMethod http://127.0.0.1:8077/api/update
          Write-Host "Updater: $($upd.status) (current $($upd.current))"
          $sessions = Invoke-RestMethod http://127.0.0.1:8077/api/sessions
          Write-Host "Imported sessions: $($sessions.Count)"
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { Get-Content "$env:APPDATA\SimCoach\simcoach.log" -ErrorAction SilentlyContinue; exit 1 }
          if ($sessions.Count -lt 1) { Write-Error "sample data not bundled"; exit 1 }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" packaging\SimCoach.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\SimCoach\* -DestinationPath "dist\SimCoach-portable-${{ steps.ver.outputs.version }}.zip"

      - name: Checksums (used by the in-app updater)
        shell: pwsh
        run: |
          Get-ChildItem dist\SimCoach-Setup-*.exe, dist\SimCoach-portable-*.zip | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: SimCoach-${{ steps.ver.outputs.version }}
          path: |
            dist/SimCoach-Setup-*.exe
            dist/SimCoach-portable-*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: GitHub release
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.windows.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: SimCoach ${{ needs.windows.outputs.version }}
          files: artifacts/*
          generate_release_notes: true
          make_latest: true
